<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kies het woord</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f7f3df;
    color: #222;
}

main {
    max-width: 850px;
    margin: auto;
    padding: 25px;
    text-align: center;
}

h1 {
    font-size: 34px;
    margin-bottom: 25px;
}

#voortgang {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

#plaatje {
    width: min(520px, 95%);
    aspect-ratio: 2 / 1;

    margin: 0 auto 30px;

    background-color: white;
    background-repeat: no-repeat;
    background-size: 200% 300%;

    border: 4px solid #333;
    border-radius: 25px;
}

#antwoorden {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;

    max-width: 700px;
    margin: auto;
}

.antwoord {
    min-height: 85px;

    border: 3px solid #333;
    border-radius: 20px;

    background: white;

    font-size: 30px;
    font-weight: bold;

    cursor: pointer;

    transition: transform 0.1s;
}

.antwoord:hover {
    transform: scale(1.03);
}

.antwoord:active {
    transform: scale(0.97);
}

.fout {
    background: #ffd9d9;
    border-color: #b52d2d;
}

#melding {
    height: 45px;

    margin-top: 22px;

    font-size: 26px;
    font-weight: bold;
}

.goed {
    color: #247534;
}

.probeer {
    color: #a05400;
}

#klaar {
    display: none;

    background: white;

    border: 4px solid #333;
    border-radius: 25px;

    max-width: 500px;

    margin: 100px auto 0;
    padding: 40px;
}

#klaar h2 {
    font-size: 42px;
}

#opnieuw {
    padding: 18px 30px;

    border: 3px solid #333;
    border-radius: 18px;

    background: #fff0a8;

    font-size: 24px;
    font-weight: bold;

    cursor: pointer;
}

@media (max-width: 600px) {

    #antwoorden {
        grid-template-columns: 1fr;
    }

    .antwoord {
        min-height: 65px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<main>

    <div id="spel">

        <h1>Kies het woord</h1>

        <div id="voortgang"></div>

        <div id="plaatje"></div>

        <div id="antwoorden"></div>

        <div id="melding"></div>

    </div>

    <div id="klaar">

        <h2>Klaar!</h2>

        <button id="opnieuw">
            Nog een keer
        </button>

    </div>

</main>

<script>

/*
    WEEK 1

    plaatjes1.png

    sop | pop
    sok | pan
    pot | pil


    plaatjes2.png

    pit | put
    sap | kom
    lus | sik
*/


const woorden = [

    {
        woord: "sop",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 0,
        rij: 0
    },

    {
        woord: "pop",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 1,
        rij: 0
    },

    {
        woord: "sok",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 0,
        rij: 1
    },

    {
        woord: "pan",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 1,
        rij: 1
    },

    {
        woord: "pot",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 0,
        rij: 2
    },

    {
        woord: "pil",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 1,
        rij: 2
    },

    {
        woord: "pit",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 0,
        rij: 0
    },

    {
        woord: "put",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 1,
        rij: 0
    },

    {
        woord: "sap",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 0,
        rij: 1
    },

    {
        woord: "kom",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 1,
        rij: 1
    },

    {
        woord: "lus",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 0,
        rij: 2
    },

    {
        woord: "sik",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 1,
        rij: 2
    }

];


let ronde = [];
let nummer = 0;
let geblokkeerd = false;


const plaatje = document.getElementById("plaatje");
const antwoorden = document.getElementById("antwoorden");
const melding = document.getElementById("melding");
const voortgang = document.getElementById("voortgang");

const spel = document.getElementById("spel");
const klaar = document.getElementById("klaar");


function mix(lijst) {

    const nieuw = [...lijst];

    for (let i = nieuw.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            nieuw[i],
            nieuw[j]
        ] = [
            nieuw[j],
            nieuw[i]
        ];
    }

    return nieuw;
}


function startSpel() {

    ronde = mix(woorden);

    nummer = 0;

    spel.style.display = "block";
    klaar.style.display = "none";

    nieuweVraag();
}


function nieuweVraag() {

    geblokkeerd = false;

    melding.textContent = "";
    melding.className = "";

    const huidig = ronde[nummer];

    voortgang.textContent =
        `${nummer + 1} van ${ronde.length}`;

    toonPlaatje(huidig);

    maakAntwoorden(huidig);
}


function toonPlaatje(item) {

    plaatje.style.backgroundImage =
        `url("${item.afbeelding}")`;

    plaatje.style.backgroundSize =
        "200% 300%";


    const x =
        item.kolom === 0
        ? "0%"
        : "100%";


    let y = "0%";

    if (item.rij === 1) {
        y = "50%";
    }

    if (item.rij === 2) {
        y = "100%";
    }


    plaatje.style.backgroundPosition =
        `${x} ${y}`;
}


function maakAntwoorden(huidig) {

    antwoorden.innerHTML = "";


    const andereWoorden = mix(

        woorden.filter(
            item =>
                item.woord !== huidig.woord
        )

    ).slice(0, 2);


    const keuzes = mix([

        huidig.woord,

        andereWoorden[0].woord,

        andereWoorden[1].woord

    ]);


    keuzes.forEach(woord => {

        const knop =
            document.createElement("button");

        knop.className =
            "antwoord";

        knop.textContent =
            woord;


        knop.addEventListener(
            "click",
            () =>
                controleer(
                    knop,
                    woord,
                    huidig.woord
                )
        );


        antwoorden.appendChild(knop);

    });
}


function controleer(knop, gekozen, goedWoord) {

    if (geblokkeerd) {
        return;
    }


    if (gekozen !== goedWoord) {

        knop.classList.add("fout");

        knop.disabled = true;

        melding.textContent =
            "Probeer het nog eens.";

        melding.className =
            "probeer";

        return;
    }


    geblokkeerd = true;

    melding.textContent =
        "Goed gedaan!";

    melding.className =
        "goed";


    setTimeout(() => {

        nummer++;

        if (nummer >= ronde.length) {

            eindeSpel();

        } else {

            nieuweVraag();

        }

    }, 700);
}


function eindeSpel() {

    spel.style.display = "none";

    klaar.style.display = "block";
}


document
    .getElementById("opnieuw")
    .addEventListener(
        "click",
        startSpel
    );


startSpel();

</script>

</body>
</html>
