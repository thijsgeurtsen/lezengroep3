<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lezen</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f7f3df;
    color: #222;
}

main {
    width: min(950px, 100%);
    margin: 0 auto;
    padding: 30px 25px;
    text-align: center;
}

/* STARTMENU */

#startMenu {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-knoppen {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.menu-knop {
    min-height: 170px;
    padding: 20px;

    border: 4px solid #333;
    border-radius: 26px;

    background: white;

    font-size: 28px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 0 #c8b970;
}

.menu-knop:hover:not(:disabled) {
    transform: scale(1.02);
}

.menu-knop:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #c8b970;
}

.menu-knop:disabled {
    opacity: 0.4;
    cursor: default;
}

/* LADEN / FOUT */

#status {
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;

    font-size: 18px;
    font-weight: bold;
}

.foutmelding {
    color: #a52a2a;
}

/* TERUG */

.terug-knop {
    display: none;

    position: fixed;
    top: 22px;
    left: 22px;

    padding: 13px 20px;

    border: 3px solid #333;
    border-radius: 16px;

    background: white;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 0 #bbb;

    z-index: 10;
}

/* SPEL */

#spel {
    display: none;
}

h1 {
    font-size: 38px;
    margin: 10px 0 8px;
}

#instructie {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 18px;
}

#voortgang {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* PLAATJE */

.plaatje-vak {
    width: min(540px, 95%);
    height: 320px;

    margin: 0 auto 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: white;

    border: 4px solid #333;
    border-radius: 25px;

    overflow: hidden;
}

#plaatje {
    width: 100%;
    height: 100%;

    object-fit: contain;
    padding: 12px;
}

/* ANTWOORDEN */

#antwoorden {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 18px;

    max-width: 750px;
    margin: 0 auto;
}

.antwoord {
    min-height: 90px;

    border: 3px solid #333;
    border-radius: 20px;

    background: white;

    font-size: 32px;
    font-weight: bold;

    cursor: pointer;
}

.antwoord.fout {
    background: #ffd9d9;
    border-color: #b52d2d;
}

.letter-knop {
    font-size: 46px;
}

/* BOUW HET WOORD */

#bouwGebied {
    display: none;
}

#woordVakken {
    display: flex;
    justify-content: center;
    gap: 12px;

    margin-bottom: 30px;
}

.woord-vak {
    width: 72px;
    height: 78px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-bottom: 6px solid #333;

    font-size: 44px;
    font-weight: bold;
}

#losseLetters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;
}

.losse-letter {
    width: 82px;
    height: 82px;

    border: 3px solid #333;
    border-radius: 20px;

    background: white;

    font-size: 42px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 6px 0 #c8b970;
}

.losse-letter.gebruikt {
    visibility: hidden;
}

#wisKnop {
    margin-top: 25px;

    padding: 12px 22px;

    border: 3px solid #333;
    border-radius: 15px;

    background: white;

    font-size: 19px;
    font-weight: bold;

    cursor: pointer;
}

/* MELDING */

#melding {
    min-height: 45px;

    margin-top: 24px;

    font-size: 27px;
    font-weight: bold;
}

.goed {
    color: #247534;
}

.probeer {
    color: #a05400;
}

/* KLAAR */

#klaar {
    display: none;

    min-height: 80vh;

    align-items: center;
    justify-content: center;
}

.klaar-kaart {
    width: min(500px, 95%);

    background: white;

    border: 4px solid #333;
    border-radius: 28px;

    padding: 45px 30px;
}

.klaar-kaart h2 {
    font-size: 45px;
    margin-top: 0;
}

.klaar-knoppen {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
}

.klaar-knop {
    padding: 17px 25px;

    border: 3px solid #333;
    border-radius: 18px;

    background: #fff0a8;

    font-size: 22px;
    font-weight: bold;

    cursor: pointer;
}

.klaar-knop.secundair {
    background: white;
}

/* MOBIEL */

@media (max-width: 700px) {

    main {
        padding: 80px 18px 25px;
    }

    .menu-knoppen {
        grid-template-columns: 1fr;
    }

    .menu-knop {
        min-height: 110px;
        font-size: 24px;
    }

    .plaatje-vak {
        height: 250px;
    }

    #antwoorden {
        grid-template-columns: 1fr;
    }

    .antwoord {
        min-height: 70px;
    }

    .woord-vak {
        width: 58px;
        height: 65px;
        font-size: 36px;
    }

    .losse-letter {
        width: 70px;
        height: 70px;
        font-size: 36px;
    }

    .terug-knop {
        top: 14px;
        left: 14px;
    }
}
</style>
</head>

<body>

<button id="terugKnop" class="terug-knop">
    ← Terug
</button>

<main>

<section id="startMenu">

    <div id="status">
        Woorden laden...
    </div>

    <div class="menu-knoppen">

        <button
            id="kiesWoordKnop"
            class="menu-knop"
            disabled>
            Kies het woord
        </button>

        <button
            id="eersteLetterKnop"
            class="menu-knop"
            disabled>
            Eerste letter
        </button>

        <button
            id="bouwWoordKnop"
            class="menu-knop"
            disabled>
            Bouw het woord
        </button>

    </div>

</section>


<section id="spel">

    <h1 id="spelTitel"></h1>

    <div id="instructie"></div>

    <div id="voortgang"></div>

    <div class="plaatje-vak">

        <img
            id="plaatje"
            src=""
            alt="">

    </div>

    <div id="antwoorden"></div>

    <div id="bouwGebied">

        <div id="woordVakken"></div>

        <div id="losseLetters"></div>

        <button id="wisKnop">
            Wis
        </button>

    </div>

    <div id="melding"></div>

</section>


<section id="klaar">

    <div class="klaar-kaart">

        <h2>Klaar!</h2>

        <div class="klaar-knoppen">

            <button
                id="opnieuwKnop"
                class="klaar-knop">
                Nog een keer
            </button>

            <button
                id="menuKnop"
                class="klaar-knop secundair">
                Terug naar menu
            </button>

        </div>

    </div>

</section>

</main>


<script>

let actieveWeek = 0;
let weekMap = "";
let woorden = [];
let beginLetters = [];

let spelType = "";
let ronde = [];
let nummer = 0;
let geblokkeerd = false;
let gekozenLetters = [];


const startMenu =
    document.getElementById("startMenu");

const spel =
    document.getElementById("spel");

const klaar =
    document.getElementById("klaar");

const terugKnop =
    document.getElementById("terugKnop");

const spelTitel =
    document.getElementById("spelTitel");

const instructie =
    document.getElementById("instructie");

const plaatje =
    document.getElementById("plaatje");

const antwoorden =
    document.getElementById("antwoorden");

const bouwGebied =
    document.getElementById("bouwGebied");

const woordVakken =
    document.getElementById("woordVakken");

const losseLetters =
    document.getElementById("losseLetters");

const wisKnop =
    document.getElementById("wisKnop");

const melding =
    document.getElementById("melding");

const voortgang =
    document.getElementById("voortgang");

const status =
    document.getElementById("status");

const kiesWoordKnop =
    document.getElementById("kiesWoordKnop");

const eersteLetterKnop =
    document.getElementById("eersteLetterKnop");

const bouwWoordKnop =
    document.getElementById("bouwWoordKnop");


/* =========================
   WEEK LADEN
========================= */

async function laadActieveWeek() {

    try {

        const tijd =
            Date.now();

        const actiefResponse =
            await fetch(
                `weken/actief.json?v=${tijd}`
            );

        if (!actiefResponse.ok) {
            throw new Error("actief.json niet gevonden");
        }

        const actief =
            await actiefResponse.json();

        actieveWeek =
            Number(actief.week);

        weekMap =
            `week${String(actieveWeek).padStart(2, "0")}`;


        const woordenResponse =
            await fetch(
                `weken/${weekMap}/woorden.json?v=${tijd}`
            );

        if (!woordenResponse.ok) {
            throw new Error("woorden.json niet gevonden");
        }


        const lijst =
            await woordenResponse.json();


        woorden =
            lijst.map(
                woord => ({
                    woord: woord,
                    afbeelding:
                        `weken/${weekMap}/${woord}.png`
                })
            );


        beginLetters = [
            ...new Set(
                woorden.map(
                    item =>
                        item.woord.charAt(0)
                )
            )
        ];


        status.textContent = "";

        kiesWoordKnop.disabled = false;
        eersteLetterKnop.disabled = false;
        bouwWoordKnop.disabled = false;

    }

    catch (fout) {

        console.error(fout);

        status.textContent =
            "De woorden konden niet worden geladen.";

        status.classList.add(
            "foutmelding"
        );

    }

}


/* =========================
   HUSSEN
========================= */

function mix(lijst) {

    const nieuw = [...lijst];

    for (
        let i = nieuw.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            nieuw[i],
            nieuw[j]
        ] = [
            nieuw[j],
            nieuw[i]
        ];

    }

    return nieuw;
}


/* =========================
   MENU
========================= */

function toonMenu() {

    startMenu.style.display =
        "flex";

    spel.style.display =
        "none";

    klaar.style.display =
        "none";

    terugKnop.style.display =
        "none";

}


/* =========================
   START SPEL
========================= */

function startSpel(type) {

    spelType = type;

    ronde = mix(woorden);

    nummer = 0;

    startMenu.style.display =
        "none";

    klaar.style.display =
        "none";

    spel.style.display =
        "block";

    terugKnop.style.display =
        "block";

    nieuweVraag();

}


/* =========================
   NIEUWE VRAAG
========================= */

function nieuweVraag() {

    geblokkeerd = false;
    gekozenLetters = [];

    melding.textContent = "";
    melding.className = "";

    antwoorden.innerHTML = "";

    bouwGebied.style.display =
        "none";

    const huidig =
        ronde[nummer];

    voortgang.textContent =
        `${nummer + 1} van ${ronde.length}`;

    plaatje.src =
        huidig.afbeelding;

    plaatje.alt =
        `Plaatje van ${huidig.woord}`;


    if (spelType === "woord") {

        spelTitel.textContent =
            "Kies het woord";

        instructie.textContent =
            "Welk woord hoort bij het plaatje?";

        antwoorden.style.display =
            "grid";

        maakWoordAntwoorden(
            huidig
        );

    }


    if (spelType === "letter") {

        spelTitel.textContent =
            "Eerste letter";

        instructie.textContent =
            "Met welke letter begint het woord?";

        antwoorden.style.display =
            "grid";

        maakLetterAntwoorden(
            huidig
        );

    }


    if (spelType === "bouw") {

        spelTitel.textContent =
            "Bouw het woord";

        instructie.textContent =
            "Zet de letters in de goede volgorde.";

        antwoorden.style.display =
            "none";

        bouwGebied.style.display =
            "block";

        maakBouwSpel(
            huidig
        );

    }

}


/* =========================
   KIES HET WOORD
========================= */

function maakWoordAntwoorden(huidig) {

    const andere =
        mix(
            woorden.filter(
                item =>
                    item.woord !==
                    huidig.woord
            )
        ).slice(0, 2);


    const keuzes =
        mix([
            huidig.woord,
            ...andere.map(
                item => item.woord
            )
        ]);


    keuzes.forEach(
        woord => {

            maakAntwoordKnop(
                woord,
                woord === huidig.woord,
                false
            );

        }
    );

}


/* =========================
   EERSTE LETTER
========================= */

function maakLetterAntwoorden(huidig) {

    const goed =
        huidig.woord.charAt(0);


    const fout =
        mix(
            beginLetters.filter(
                letter =>
                    letter !== goed
            )
        ).slice(0, 2);


    const keuzes =
        mix([
            goed,
            ...fout
        ]);


    keuzes.forEach(
        letter => {

            maakAntwoordKnop(
                letter,
                letter === goed,
                true
            );

        }
    );

}


/* =========================
   ANTWOORDKNOP
========================= */

function maakAntwoordKnop(
    tekst,
    goed,
    isLetter
) {

    const knop =
        document.createElement(
            "button"
        );

    knop.className =
        "antwoord";


    if (isLetter) {

        knop.classList.add(
            "letter-knop"
        );

    }


    knop.textContent =
        tekst;


    knop.addEventListener(
        "click",
        () => {

            controleer(
                knop,
                goed
            );

        }
    );


    antwoorden.appendChild(
        knop
    );

}


/* =========================
   BOUW HET WOORD
========================= */

function maakBouwSpel(huidig) {

    woordVakken.innerHTML = "";
    losseLetters.innerHTML = "";

    const letters =
        huidig.woord.split("");


    letters.forEach(
        () => {

            const vak =
                document.createElement(
                    "div"
                );

            vak.className =
                "woord-vak";

            woordVakken.appendChild(
                vak
            );

        }
    );


    const losse =
        letters.map(
            (letter, id) => ({
                letter,
                id
            })
        );


    mix(losse).forEach(
        item => {

            const knop =
                document.createElement(
                    "button"
                );

            knop.className =
                "losse-letter";

            knop.textContent =
                item.letter;


            knop.addEventListener(
                "click",
                () => {

                    kiesLetter(
                        knop,
                        item.letter
                    );

                }
            );


            losseLetters.appendChild(
                knop
            );

        }
    );

}


/* =========================
   LETTER KIEZEN
========================= */

function kiesLetter(
    knop,
    letter
) {

    if (geblokkeerd) {
        return;
    }

    if (
        knop.classList.contains(
            "gebruikt"
        )
    ) {
        return;
    }


    gekozenLetters.push({
        letter,
        knop
    });


    knop.classList.add(
        "gebruikt"
    );


    updateWoordVakken();


    const huidig =
        ronde[nummer];


    if (
        gekozenLetters.length ===
        huidig.woord.length
    ) {

        controleerGebouwdWoord();

    }

}


/* =========================
   WOORDVAKKEN
========================= */

function updateWoordVakken() {

    const vakken =
        woordVakken.querySelectorAll(
            ".woord-vak"
        );


    vakken.forEach(
        (vak, index) => {

            vak.textContent =
                gekozenLetters[index]
                ? gekozenLetters[index].letter
                : "";

        }
    );

}


/* =========================
   GEBOUWD WOORD
========================= */

function controleerGebouwdWoord() {

    const huidig =
        ronde[nummer];


    const gemaakt =
        gekozenLetters
            .map(
                item => item.letter
            )
            .join("");


    if (
        gemaakt ===
        huidig.woord
    ) {

        geblokkeerd = true;

        melding.textContent =
            "Goed gedaan!";

        melding.className =
            "goed";

        setTimeout(
            volgendeVraag,
            700
        );

    }

    else {

        melding.textContent =
            "Probeer het nog eens.";

        melding.className =
            "probeer";

        setTimeout(
            wisLetters,
            800
        );

    }

}


/* =========================
   WISSEN
========================= */

function wisLetters() {

    gekozenLetters.forEach(
        item => {

            item.knop.classList.remove(
                "gebruikt"
            );

        }
    );

    gekozenLetters = [];

    updateWoordVakken();

    melding.textContent = "";
    melding.className = "";

}


/* =========================
   CONTROLEREN
========================= */

function controleer(
    knop,
    goed
) {

    if (geblokkeerd) {
        return;
    }


    if (!goed) {

        knop.classList.add(
            "fout"
        );

        knop.disabled = true;

        melding.textContent =
            "Probeer het nog eens.";

        melding.className =
            "probeer";

        return;
    }


    geblokkeerd = true;

    melding.textContent =
        "Goed gedaan!";

    melding.className =
        "goed";

    setTimeout(
        volgendeVraag,
        700
    );

}


/* =========================
   VOLGENDE
========================= */

function volgendeVraag() {

    nummer++;

    if (
        nummer >=
        ronde.length
    ) {

        eindeSpel();

    }

    else {

        nieuweVraag();

    }

}


/* =========================
   EINDE
========================= */

function eindeSpel() {

    spel.style.display =
        "none";

    klaar.style.display =
        "flex";

    terugKnop.style.display =
        "none";

}


/* =========================
   KNOPPEN
========================= */

kiesWoordKnop.addEventListener(
    "click",
    () => startSpel("woord")
);

eersteLetterKnop.addEventListener(
    "click",
    () => startSpel("letter")
);

bouwWoordKnop.addEventListener(
    "click",
    () => startSpel("bouw")
);

wisKnop.addEventListener(
    "click",
    wisLetters
);

terugKnop.addEventListener(
    "click",
    toonMenu
);

document
    .getElementById("opnieuwKnop")
    .addEventListener(
        "click",
        () => startSpel(spelType)
    );

document
    .getElementById("menuKnop")
    .addEventListener(
        "click",
        toonMenu
    );


/* =========================
   START
========================= */

toonMenu();
laadActieveWeek();

</script>

</body>
</html>
