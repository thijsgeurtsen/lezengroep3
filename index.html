<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Lezen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #fff7d6, #eef8ff);
      color: #24313a;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* BEGINPAGINA */

    #home {
      min-height: 90vh;
    }

    #home.active {
      display: grid;
      place-items: center;
    }

    .menu {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .mode-button {
      min-height: 180px;

      border: 3px solid #24313a;
      border-radius: 28px;

      background: white;

      box-shadow: 0 8px 0 #d7c27c;

      font-size: 1.5rem;
      font-weight: 900;

      cursor: pointer;
    }

    .mode-button:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #d7c27c;
    }

    /* OEFENSCHERM */

    .game-top {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 15px;
      align-items: center;

      margin-bottom: 18px;
    }

    .small-button {
      border: 2px solid #24313a;
      border-radius: 15px;

      background: white;

      padding: 11px 16px;

      font-weight: 800;

      cursor: pointer;

      box-shadow: 0 4px 0 #bbbbbb;
    }

    .progress {
      text-align: center;
      font-weight: 900;
    }

    .progress-track {
      height: 11px;

      margin-top: 7px;

      background: #ddd8ca;

      border-radius: 20px;

      overflow: hidden;
    }

    .progress-fill {
      width: 0;
      height: 100%;

      background: #f5ba37;

      transition: width 0.2s;
    }

    .exercise-card {
      background: white;

      border: 3px solid #24313a;
      border-radius: 28px;

      padding: 25px;

      text-align: center;

      box-shadow: 0 8px 0 rgba(36, 49, 58, 0.12);
    }

    .instruction {
      margin: 0 0 18px;

      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 900;
    }

    /* PLAATJE */

    .picture {
      width: min(520px, 100%);

      aspect-ratio: 2 / 1;

      margin: 0 auto 24px;

      background-color: white;
      background-repeat: no-repeat;
      background-size: 200% 300%;

      border: 3px solid #dddddd;
      border-radius: 24px;

      overflow: hidden;
    }

    /* WOORDKEUZES */

    .choices {
      width: min(650px, 100%);
      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
    }

    .choice-button {
      min-height: 78px;

      border: 3px solid #24313a;
      border-radius: 20px;

      background: #fff4c7;

      box-shadow: 0 6px 0 #cab45d;

      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 900;

      cursor: pointer;
    }

    .choice-button.wrong {
      background: #ffe0dd;
      border-color: #a63b35;
    }

    .choice-button:disabled {
      cursor: default;
    }

    /* WOORD BOUWEN */

    .slots {
      min-height: 75px;

      display: flex;
      justify-content: center;
      gap: 10px;

      margin-bottom: 22px;
    }

    .slot {
      width: 58px;
      height: 68px;

      border-bottom: 5px solid #24313a;

      display: grid;
      place-items: center;

      font-size: 2.2rem;
      font-weight: 900;
    }

    .letters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 13px;
    }

    .letter-button {
      width: 68px;
      height: 68px;

      border: 3px solid #24313a;
      border-radius: 18px;

      background: #dff3ff;

      box-shadow: 0 6px 0 #9fbfce;

      font-size: 2rem;
      font-weight: 900;

      cursor: pointer;
    }

    .letter-button.used {
      visibility: hidden;
    }

    .erase-button {
      margin-top: 20px;
    }

    /* FEEDBACK */

    .feedback {
      min-height: 36px;

      margin-top: 18px;

      font-size: 1.3rem;
      font-weight: 900;
    }

    .feedback.good {
      color: #28743b;
    }

    .feedback.try {
      color: #995000;
    }

    /* KLAAR */

    #finish {
      min-height: 85vh;
    }

    #finish.active {
      display: grid;
      place-items: center;
    }

    .finish-card {
      width: min(500px, 100%);

      padding: 35px;

      background: white;

      border: 3px solid #24313a;
      border-radius: 28px;

      text-align: center;
    }

    .finish-card h2 {
      margin-top: 0;

      font-size: 2.6rem;
    }

    .finish-buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* TELEFOON / TABLET */

    @media (max-width: 650px) {

      .menu {
        grid-template-columns: 1fr;
      }

      .mode-button {
        min-height: 115px;
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .choice-button {
        min-height: 65px;
      }

    }
  </style>
</head>

<body>

<main class="app">

  <!-- BEGINPAGINA -->

  <section id="home" class="screen active">

    <div class="menu">

      <button
        class="mode-button"
        data-mode="word">
        Kies het woord
      </button>

      <button
        class="mode-button"
        data-mode="letter">
        Eerste letter
      </button>

      <button
        class="mode-button"
        data-mode="build">
        Bouw het woord
      </button>

    </div>

  </section>


  <!-- OEFENSCHERM -->

  <section id="game" class="screen">

    <div class="game-top">

      <button
        id="backButton"
        class="small-button">
        ← Terug
      </button>

      <div class="progress">

        <span id="counter">
          1 / 12
        </span>

        <div class="progress-track">
          <div
            id="progressFill"
            class="progress-fill">
          </div>
        </div>

      </div>

    </div>


    <div class="exercise-card">

      <p
        id="instruction"
        class="instruction">
      </p>

      <div
        id="picture"
        class="picture">
      </div>

      <div id="answerArea">
      </div>

      <div
        id="feedback"
        class="feedback">
      </div>

    </div>

  </section>


  <!-- EINDSCHERM -->

  <section id="finish" class="screen">

    <div class="finish-card">

      <h2>Klaar!</h2>

      <div class="finish-buttons">

        <button
          id="againButton"
          class="small-button">
          Nog een keer
        </button>

        <button
          id="menuButton"
          class="small-button">
          Terug
        </button>

      </div>

    </div>

  </section>

</main>


<script>

  /*
    PLAATJES

    plaatjes1.png:

    sop | pop
    sok | pan
    pot | pil


    plaatjes2.png:

    pit | put
    sap | kom
    lus | sik
  */

  const WORDS = [

    {
      word: "sop",
      sheet: "plaatjes1.png",
      column: 0,
      row: 0
    },

    {
      word: "pop",
      sheet: "plaatjes1.png",
      column: 1,
      row: 0
    },

    {
      word: "sok",
      sheet: "plaatjes1.png",
      column: 0,
      row: 1
    },

    {
      word: "pan",
      sheet: "plaatjes1.png",
      column: 1,
      row: 1
    },

    {
      word: "pot",
      sheet: "plaatjes1.png",
      column: 0,
      row: 2
    },

    {
      word: "pil",
      sheet: "plaatjes1.png",
      column: 1,
      row: 2
    },

    {
      word: "pit",
      sheet: "plaatjes2.png",
      column: 0,
      row: 0
    },

    {
      word: "put",
      sheet: "plaatjes2.png",
      column: 1,
      row: 0
    },

    {
      word: "sap",
      sheet: "plaatjes2.png",
      column: 0,
      row: 1
    },

    {
      word: "kom",
      sheet: "plaatjes2.png",
      column: 1,
      row: 1
    },

    {
      word: "lus",
      sheet: "plaatjes2.png",
      column: 0,
      row: 2
    },

    {
      word: "sik",
      sheet: "plaatjes2.png",
      column: 1,
      row: 2
    }

  ];


  const START_LETTERS = [
    ...new Set(
      WORDS.map(item => item.word[0])
    )
  ];


  const homeScreen =
    document.querySelector("#home");

  const gameScreen =
    document.querySelector("#game");

  const finishScreen =
    document.querySelector("#finish");

  const instruction =
    document.querySelector("#instruction");

  const picture =
    document.querySelector("#picture");

  const answerArea =
    document.querySelector("#answerArea");

  const feedback =
    document.querySelector("#feedback");

  const counter =
    document.querySelector("#counter");

  const progressFill =
    document.querySelector("#progressFill");


  let mode = "";

  let round = [];

  let currentIndex = 0;

  let locked = false;

  let builtLetters = [];


  function shuffle(array) {

    const copy = [...array];

    for (
      let i = copy.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [
        copy[i],
        copy[j]
      ] = [
        copy[j],
        copy[i]
      ];

    }

    return copy;
  }


  function showScreen(screen) {

    homeScreen.classList.remove("active");

    gameScreen.classList.remove("active");

    finishScreen.classList.remove("active");

    screen.classList.add("active");
  }


  function currentWord() {

    return round[currentIndex];
  }


  function startGame(selectedMode) {

    mode = selectedMode;

    round = shuffle(WORDS);

    currentIndex = 0;

    showScreen(gameScreen);

    renderQuestion();
  }


  function showPicture(item) {

    picture.style.backgroundImage =
      `url("${item.sheet}")`;

    picture.style.backgroundSize =
      "200% 300%";


    const horizontalPosition =
      item.column === 0
      ? "0%"
      : "100%";


    let verticalPosition = "0%";

    if (item.row === 1) {
      verticalPosition = "50%";
    }

    if (item.row === 2) {
      verticalPosition = "100%";
    }


    picture.style.backgroundPosition =
      `${horizontalPosition} ${verticalPosition}`;

  }


  function renderQuestion() {

    locked = false;

    builtLetters = [];

    feedback.textContent = "";

    feedback.className =
      "feedback";


    counter.textContent =
      `${currentIndex + 1} / ${round.length}`;


    progressFill.style.width =
      `${(currentIndex / round.length) * 100}%`;


    answerArea.innerHTML = "";


    showPicture(
      currentWord()
    );


    if (mode === "word") {

      renderWordQuestion();

    }


    if (mode === "letter") {

      renderLetterQuestion();

    }


    if (mode === "build") {

      renderBuildQuestion();

    }

  }


  /*
    KIES HET WOORD
  */

  function renderWordQuestion() {

    instruction.textContent =
      "Welk woord hoort bij het plaatje?";


    const wrongWords =
      shuffle(

        WORDS.filter(
          item =>
            item.word !==
            currentWord().word
        )

      )
      .slice(0, 2)
      .map(
        item => item.word
      );


    const choices = [

      currentWord().word,

      ...wrongWords

    ];


    createChoiceButtons(
      choices,
      currentWord().word
    );

  }


  /*
    EERSTE LETTER
  */

  function renderLetterQuestion() {

    instruction.textContent =
      "Wat is de eerste letter?";


    const correctLetter =
      currentWord().word[0];


    const wrongLetters =
      shuffle(

        START_LETTERS.filter(
          letter =>
            letter !==
            correctLetter
        )

      )
      .slice(0, 2);


    const choices = [

      correctLetter,

      ...wrongLetters

    ];


    createChoiceButtons(
      choices,
      correctLetter
    );

  }


  /*
    KEUZEKNOPPEN
  */

  function createChoiceButtons(
    choices,
    correctAnswer
  ) {

    const container =
      document.createElement("div");

    container.className =
      "choices";


    shuffle(choices).forEach(
      choice => {

        const button =
          document.createElement("button");


        button.className =
          "choice-button";


        button.textContent =
          choice;


        button.addEventListener(
          "click",
          () => {

            checkChoice(
              button,
              choice === correctAnswer
            );

          }
        );


        container.appendChild(
          button
        );

      }
    );


    answerArea.appendChild(
      container
    );

  }


  function checkChoice(
    button,
    isCorrect
  ) {

    if (locked) {
      return;
    }


    if (!isCorrect) {

      button.classList.add(
        "wrong"
      );

      button.disabled = true;

      feedback.textContent =
        "Probeer het nog eens.";

      feedback.className =
        "feedback try";

      return;
    }


    locked = true;


    feedback.textContent =
      "Goed gedaan!";


    feedback.className =
      "feedback good";


    setTimeout(
      nextQuestion,
      700
    );

  }


  /*
    BOUW HET WOORD
  */

  function renderBuildQuestion() {

    instruction.textContent =
      "Bouw het woord.";


    const slots =
      document.createElement("div");

    slots.className =
      "slots";


    [
      ...currentWord().word
    ].forEach(
      () => {

        const slot =
          document.createElement("div");

        slot.className =
          "slot";

        slots.appendChild(
          slot
        );

      }
    );


    const letters =
      document.createElement("div");

    letters.className =
      "letters";


    const letterObjects = [

      ...currentWord().word

    ].map(
      (letter, id) => {

        return {
          letter: letter,
          id: id
        };

      }
    );


    shuffle(
      letterObjects
    ).forEach(
      item => {

        const button =
          document.createElement("button");


        button.className =
          "letter-button";


        button.textContent =
          item.letter;


        button.addEventListener(
          "click",
          () => {

            addLetter(
              button,
              item.letter
            );

          }
        );


        letters.appendChild(
          button
        );

      }
    );


    const eraseButton =
      document.createElement("button");


    eraseButton.className =
      "small-button erase-button";


    eraseButton.textContent =
      "Wis";


    eraseButton.addEventListener(
      "click",
      clearBuild
    );


    answerArea.appendChild(
      slots
    );


    answerArea.appendChild(
      letters
    );


    answerArea.appendChild(
      eraseButton
    );

  }


  function addLetter(
    button,
    letter
  ) {

    if (locked) {
      return;
    }


    if (
      button.classList.contains(
        "used"
      )
    ) {
      return;
    }


    builtLetters.push({

      button: button,

      letter: letter

    });


    button.classList.add(
      "used"
    );


    updateSlots();


    if (
      builtLetters.length ===
      currentWord().word.length
    ) {

      const builtWord =
        builtLetters
          .map(
            item => item.letter
          )
          .join("");


      if (
        builtWord ===
        currentWord().word
      ) {

        locked = true;


        feedback.textContent =
          "Goed gedaan!";


        feedback.className =
          "feedback good";


        setTimeout(
          nextQuestion,
          700
        );

      } else {

        feedback.textContent =
          "Probeer het nog eens.";


        feedback.className =
          "feedback try";


        setTimeout(
          clearBuild,
          700
        );

      }

    }

  }


  function updateSlots() {

    const slots =
      answerArea.querySelectorAll(
        ".slot"
      );


    slots.forEach(
      (slot, index) => {

        if (
          builtLetters[index]
        ) {

          slot.textContent =
            builtLetters[index].letter;

        } else {

          slot.textContent =
            "";

        }

      }
    );

  }


  function clearBuild() {

    builtLetters.forEach(
      item => {

        item.button.classList.remove(
          "used"
        );

      }
    );


    builtLetters = [];


    updateSlots();


    feedback.textContent =
      "";


    feedback.className =
      "feedback";

  }


  /*
    VOLGENDE
  */

  function nextQuestion() {

    currentIndex++;


    if (
      currentIndex >=
      round.length
    ) {

      progressFill.style.width =
        "100%";


      showScreen(
        finishScreen
      );

      return;
    }


    renderQuestion();

  }


  /*
    KNOPPEN
  */

  document
    .querySelectorAll(
      ".mode-button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            startGame(
              button.dataset.mode
            );

          }
        );

      }
    );


  document
    .querySelector(
      "#backButton"
    )
    .addEventListener(
      "click",
      () => {

        showScreen(
          homeScreen
        );

      }
    );


  document
    .querySelector(
      "#againButton"
    )
    .addEventListener(
      "click",
      () => {

        startGame(
          mode
        );

      }
    );


  document
    .querySelector(
      "#menuButton"
    )
    .addEventListener(
      "click",
      () => {

        showScreen(
          homeScreen
        );

      }
    );

</script>

</body>
</html>
