<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lezen</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f7f3df;
    color: #222;
}

main {
    max-width: 950px;
    margin: auto;
    padding: 30px 25px;
    text-align: center;
}

/* ------------------------------
   STARTMENU
------------------------------ */

#startMenu {
    min-height: 85vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.menu-knoppen {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 22px;

    max-width: 900px;
    width: 100%;

    margin: auto;
}

.menu-knop {
    min-height: 170px;

    padding: 20px;

    border: 4px solid #333;
    border-radius: 26px;

    background: white;

    font-size: 28px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 0 #c8b970;

    transition:
        transform 0.1s,
        box-shadow 0.1s;
}

.menu-knop:hover:not(:disabled) {
    transform: scale(1.02);
}

.menu-knop:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #c8b970;
}

.menu-knop:disabled {
    opacity: 0.4;
    cursor: default;
}

/* ------------------------------
   TERUGKNOP
------------------------------ */

.terug-knop {
    display: none;

    position: fixed;
    top: 22px;
    left: 22px;

    padding: 13px 20px;

    border: 3px solid #333;
    border-radius: 16px;

    background: white;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 0 #bbb;

    z-index: 10;
}

.terug-knop:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #bbb;
}

/* ------------------------------
   SPEL
------------------------------ */

#spel {
    display: none;
}

h1 {
    font-size: 38px;
    margin: 10px 0 28px;
}

#voortgang {
    font-size: 22px;
    font-weight: bold;

    margin-bottom: 20px;
}

/* ------------------------------
   PLAATJE
------------------------------ */

#plaatje {
    width: min(520px, 95%);
    aspect-ratio: 2 / 1;

    margin: 0 auto 35px;

    background-color: white;
    background-repeat: no-repeat;
    background-size: 200% 300%;

    border: 4px solid #333;
    border-radius: 25px;

    overflow: hidden;
}

/* ------------------------------
   ANTWOORDEN
------------------------------ */

#antwoorden {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 18px;

    max-width: 750px;

    margin: auto;
}

.antwoord {
    min-height: 90px;

    border: 3px solid #333;
    border-radius: 20px;

    background: white;

    font-size: 32px;
    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.1s,
        background 0.2s;
}

.antwoord:hover {
    transform: scale(1.03);
}

.antwoord:active {
    transform: scale(0.97);
}

.antwoord.fout {
    background: #ffd9d9;
    border-color: #b52d2d;
}

/* ------------------------------
   MELDING
------------------------------ */

#melding {
    min-height: 45px;

    margin-top: 24px;

    font-size: 27px;
    font-weight: bold;
}

.goed {
    color: #247534;
}

.probeer {
    color: #a05400;
}

/* ------------------------------
   KLAAR
------------------------------ */

#klaar {
    display: none;

    min-height: 80vh;

    align-items: center;
    justify-content: center;
}

.klaar-kaart {
    width: min(500px, 95%);

    background: white;

    border: 4px solid #333;
    border-radius: 28px;

    padding: 45px 30px;
}

.klaar-kaart h2 {
    margin-top: 0;

    font-size: 45px;
}

.klaar-knoppen {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;

    gap: 15px;

    margin-top: 30px;
}

.klaar-knop {
    padding: 17px 25px;

    border: 3px solid #333;
    border-radius: 18px;

    background: #fff0a8;

    font-size: 22px;
    font-weight: bold;

    cursor: pointer;
}

.klaar-knop.secundair {
    background: white;
}

/* ------------------------------
   TELEFOON / TABLET
------------------------------ */

@media (max-width: 700px) {

    main {
        padding: 85px 18px 25px;
    }

    #startMenu {
        min-height: 70vh;
    }

    .menu-knoppen {
        grid-template-columns: 1fr;
    }

    .menu-knop {
        min-height: 110px;
        font-size: 24px;
    }

    #antwoorden {
        grid-template-columns: 1fr;
    }

    .antwoord {
        min-height: 70px;
    }

    h1 {
        font-size: 30px;
    }

    .terug-knop {
        top: 14px;
        left: 14px;

        padding: 10px 15px;

        font-size: 17px;
    }
}
</style>
</head>

<body>

<button id="terugKnop" class="terug-knop">
    ← Terug
</button>


<main>

    <!-- =========================
         STARTMENU
    ========================== -->

    <section id="startMenu">

        <div class="menu-knoppen">

            <button
                id="kiesWoordKnop"
                class="menu-knop">
                Kies het woord
            </button>

            <button
                class="menu-knop"
                disabled>
                Eerste letter
            </button>

            <button
                class="menu-knop"
                disabled>
                Bouw het woord
            </button>

        </div>

    </section>


    <!-- =========================
         SPEL 1
    ========================== -->

    <section id="spel">

        <h1>Kies het woord</h1>

        <div id="voortgang"></div>

        <div id="plaatje"></div>

        <div id="antwoorden"></div>

        <div id="melding"></div>

    </section>


    <!-- =========================
         EINDSCHERM
    ========================== -->

    <section id="klaar">

        <div class="klaar-kaart">

            <h2>Klaar!</h2>

            <div class="klaar-knoppen">

                <button
                    id="opnieuwKnop"
                    class="klaar-knop">
                    Nog een keer
                </button>

                <button
                    id="menuKnop"
                    class="klaar-knop secundair">
                    Terug naar menu
                </button>

            </div>

        </div>

    </section>

</main>


<script>

/*
====================================
WEEK 1

plaatjes1.png

sop | pop
sok | pan
pot | pil


plaatjes2.png

pit | put
sap | kom
lus | sik
====================================
*/


const woorden = [

    {
        woord: "sop",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 0,
        rij: 0
    },

    {
        woord: "pop",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 1,
        rij: 0
    },

    {
        woord: "sok",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 0,
        rij: 1
    },

    {
        woord: "pan",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 1,
        rij: 1
    },

    {
        woord: "pot",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 0,
        rij: 2
    },

    {
        woord: "pil",
        afbeelding: "weken/week01/plaatjes1.png",
        kolom: 1,
        rij: 2
    },

    {
        woord: "pit",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 0,
        rij: 0
    },

    {
        woord: "put",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 1,
        rij: 0
    },

    {
        woord: "sap",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 0,
        rij: 1
    },

    {
        woord: "kom",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 1,
        rij: 1
    },

    {
        woord: "lus",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 0,
        rij: 2
    },

    {
        woord: "sik",
        afbeelding: "weken/week01/plaatjes2.png",
        kolom: 1,
        rij: 2
    }

];


/* ================================
   VARIABELEN
================================ */

let ronde = [];

let nummer = 0;

let geblokkeerd = false;


/* ================================
   ELEMENTEN
================================ */

const startMenu =
    document.getElementById("startMenu");

const spel =
    document.getElementById("spel");

const klaar =
    document.getElementById("klaar");

const terugKnop =
    document.getElementById("terugKnop");

const plaatje =
    document.getElementById("plaatje");

const antwoorden =
    document.getElementById("antwoorden");

const melding =
    document.getElementById("melding");

const voortgang =
    document.getElementById("voortgang");


/* ================================
   LIJST DOOR ELKAAR HUSSEN
================================ */

function mix(lijst) {

    const nieuw = [...lijst];

    for (
        let i = nieuw.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            nieuw[i],
            nieuw[j]
        ] = [
            nieuw[j],
            nieuw[i]
        ];

    }

    return nieuw;
}


/* ================================
   STARTMENU TONEN
================================ */

function toonMenu() {

    startMenu.style.display = "flex";

    spel.style.display = "none";

    klaar.style.display = "none";

    terugKnop.style.display = "none";

}


/* ================================
   SPEL STARTEN
================================ */

function startSpel() {

    ronde = mix(woorden);

    nummer = 0;

    startMenu.style.display = "none";

    klaar.style.display = "none";

    spel.style.display = "block";

    terugKnop.style.display = "block";

    nieuweVraag();

}


/* ================================
   NIEUWE VRAAG
================================ */

function nieuweVraag() {

    geblokkeerd = false;

    melding.textContent = "";

    melding.className = "";


    const huidig =
        ronde[nummer];


    voortgang.textContent =
        `${nummer + 1} van ${ronde.length}`;


    toonPlaatje(huidig);

    maakAntwoorden(huidig);

}


/* ================================
   PLAATJE TONEN
================================ */

function toonPlaatje(item) {

    plaatje.style.backgroundImage =
        `url("${item.afbeelding}")`;


    plaatje.style.backgroundSize =
        "200% 300%";


    const x =
        item.kolom === 0
        ? "0%"
        : "100%";


    let y = "0%";


    if (item.rij === 1) {

        y = "50%";

    }


    if (item.rij === 2) {

        y = "100%";

    }


    plaatje.style.backgroundPosition =
        `${x} ${y}`;

}


/* ================================
   ANTWOORDEN MAKEN
================================ */

function maakAntwoorden(huidig) {

    antwoorden.innerHTML = "";


    const andereWoorden =
        mix(

            woorden.filter(
                item =>
                    item.woord !==
                    huidig.woord
            )

        ).slice(0, 2);


    const keuzes =
        mix([

            huidig.woord,

            andereWoorden[0].woord,

            andereWoorden[1].woord

        ]);


    keuzes.forEach(
        woord => {

            const knop =
                document.createElement(
                    "button"
                );


            knop.className =
                "antwoord";


            knop.textContent =
                woord;


            knop.addEventListener(
                "click",
                () => {

                    controleer(
                        knop,
                        woord,
                        huidig.woord
                    );

                }
            );


            antwoorden.appendChild(
                knop
            );

        }
    );

}


/* ================================
   ANTWOORD CONTROLEREN
================================ */

function controleer(
    knop,
    gekozen,
    goedWoord
) {

    if (geblokkeerd) {

        return;

    }


    /* FOUT */

    if (gekozen !== goedWoord) {

        knop.classList.add(
            "fout"
        );

        knop.disabled = true;


        melding.textContent =
            "Probeer het nog eens.";


        melding.className =
            "probeer";


        return;

    }


    /* GOED */

    geblokkeerd = true;


    melding.textContent =
        "Goed gedaan!";


    melding.className =
        "goed";


    setTimeout(
        () => {

            nummer++;


            if (
                nummer >=
                ronde.length
            ) {

                eindeSpel();

            }

            else {

                nieuweVraag();

            }

        },
        700
    );

}


/* ================================
   EINDE SPEL
================================ */

function eindeSpel() {

    spel.style.display = "none";

    klaar.style.display = "flex";

    terugKnop.style.display = "none";

}


/* ================================
   KNOPPEN
================================ */


/* Kies het woord */

document
    .getElementById(
        "kiesWoordKnop"
    )
    .addEventListener(
        "click",
        startSpel
    );


/* Terug tijdens het spel */

terugKnop
    .addEventListener(
        "click",
        toonMenu
    );


/* Nog een keer */

document
    .getElementById(
        "opnieuwKnop"
    )
    .addEventListener(
        "click",
        startSpel
    );


/* Terug naar menu na afloop */

document
    .getElementById(
        "menuKnop"
    )
    .addEventListener(
        "click",
        toonMenu
    );


/* ================================
   APP START OP MENU
================================ */

toonMenu();

</script>

</body>
</html>
